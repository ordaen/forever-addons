name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      # Opens/updates one "release PR" with version bumps + changelogs; merging it creates the
      # tags (<Addon>-vX.Y.Z) and GitHub releases. RELEASE_PLEASE_TOKEN (a PAT) is optional but
      # needed for CI checks to run on release PRs (GITHUB_TOKEN-created PRs don't trigger workflows).
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  package:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]' && needs.release-please.outputs.paths_released != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve addon, version and tag
        run: |
          addon="$(basename "${{ matrix.path }}")"
          version="$(jq -r --arg p "${{ matrix.path }}" '.[$p]' .release-please-manifest.json)"
          echo "ADDON=$addon" >> "$GITHUB_ENV"
          echo "TAG=$addon-v$version" >> "$GITHUB_ENV"
      - name: Package (and upload to CurseForge/Wago if configured)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: scripts/package.sh "$ADDON" "$TAG"
      - name: Attach zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" .release/*.zip --clobber
